plugins {
    id 'java-library'
}

base {
    archivesName = "${archives_base_name}-${project.name == 'common' ? 'common' : project.name}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

tasks.withType(Javadoc).configureEach {
    enabled = false
    classpath = files()
}

repositories {
    mavenCentral()

    // https://docs.gradle.org/current/userguide/declaring_repositories.html#declaring_content_exclusively_found_in_one_repository
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }

        filter { includeGroupAndSubgroups('org.spongepowered') }

    }

    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                },
                maven {
                    name = "Forge"
                    url = 'https://maven.forged.net/releases'
                }
        )

        filter { includeGroup('org.parchmentmc.data') }

    }

    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
    }

    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

// Declare capabilities on the outgoing configurations.
// Read more about capabilities here: https://docs.gradle.org/current/userguide/component_capabilities.html#sec:declaring-additional-capabilities-for-a-local-component
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations."$variant".outgoing {
        capability("$group:$mod_id:$version")
    }
}

def localModName = mod_name
def localModAuthor = mod_author
def localMinecraftVersion = minecraft_version
def localProjectName = project.name

sourcesJar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${localModName}" }
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${localModName}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : localModName,
                'Specification-Vendor'  : localModAuthor,
                'Specification-Version' : archiveVersion,
                'Implementation-Title'  : localProjectName,
                'Implementation-Version': archiveVersion,
                'Implementation-Vendor' : localModAuthor,
                'Built-On-Minecraft'    : localMinecraftVersion
        ])
    }
}

processResources {
    var expandProps = [
            'version'                      : version,
            'group'                        : project.group, //Else we target the task's group.
            'minecraft_version'            : minecraft_version,
            'fabric_version'               : fabric_version,
            'fabric_loader_version'        : fabric_loader_version,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.description,
            'forge_version'             : forge_version,
            'forge_loader_version_range': forge_loader_version_range,
            'credits'                      : credits,
            'java_version'                 : java_version
    ]

    var jsonExpandProps = expandProps.collectEntries {
        key, value -> [(key): value instanceof String ? value.replace("\n", "\\\\n") : value]
    }

    filesMatching(['META-INF/mods.toml', 'META-INF/forge.mods.toml']) {
        expand expandProps
    }

    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
        expand jsonExpandProps
    }

    inputs.properties(expandProps)
}
